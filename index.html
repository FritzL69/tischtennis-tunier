<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c69"><title>Tischtennis-Turnier</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;font-family:Arial,sans-serif;background:#eef2f7;color:#172033}
header{background:#123c69;color:white;padding:22px;border-radius:14px;text-align:center}.card{background:white;padding:16px;border-radius:12px;margin-top:14px;box-shadow:0 2px 8px #0001}
input,select,button{padding:12px;border-radius:7px;border:1px solid #ccc;font-size:16px;margin:4px 0}input,select{max-width:100%}
button{background:#1769aa;color:white;border:0;cursor:pointer}.primary{width:100%;padding:15px;font-weight:bold}.green{background:#17834b}
button:disabled{background:#999}.player,.match,.group{background:#f0f4f8;padding:12px;margin:8px 0;border-radius:9px}.group{border:1px solid #ddd;margin-top:12px}
.hidden{display:none}.badge{background:#dcecff;padding:7px 10px;border-radius:7px;display:inline-block;margin:5px 0}
.score{width:65px;text-align:center}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 4px;border-bottom:1px solid #ddd;text-align:center}th{background:#edf2f7}
h2{color:#123c69}.note{color:#65778a;font-size:13px;line-height:1.5}.status,.winner{color:#17834b;font-weight:bold}
@media(max-width:450px){table{font-size:12px}th,td{padding:7px 2px}}
</style></head><body>
<header><h1>🏓 Tischtennis-Turnier</h1><p>Dein Turnier – einfach organisiert!</p></header><main>
<section class="card" id="setup"><h2>1. Teilnehmer</h2><input id="playerName" placeholder="Name eingeben"><button onclick="addPlayer()">Hinzufügen</button><div id="players"></div><p>Teilnehmer: <b id="count">0</b></p><hr>
<h2>2. Turnier einstellen</h2><label>Anzahl Gruppen</label><br><input type="number" id="groupCount" value="2" min="1"><br>
<label>Anzahl Tischtennisplatten</label><br><input type="number" id="tableCount" value="4" min="1" max="30"><br>
<label>Wie viele kommen pro Gruppe weiter?</label><br><select id="qualify"><option value="1">1 Spieler</option><option value="2" selected>2 Spieler</option><option value="3">3 Spieler</option><option value="4">4 Spieler</option></select>
<p class="note">Die Teilnehmer werden bei jedem neuen Turnier zufällig auf die Gruppen verteilt.</p><button class="primary green" onclick="createTournament()">🏓 Turnier erstellen</button></section>
<section id="tournament" class="hidden"><section class="card"><h2>3. Gruppen</h2><div id="groups"></div></section>
<section class="card"><h2>4. Spielplan</h2><div id="roundInfo"></div><div id="matches"></div><button class="primary green" id="startButton" onclick="startRound">▶ Spielrunde starten</button><button class="primary" id="nextButton" onclick="nextRound()" disabled>Nächste Spielrunde</button></section>
<section class="card"><h2>5. Tabellen</h2><div id="tables"></div></section><section class="card"><h2>6. K.-o.-Runde 🏆</h2><div id="knockout">Wird nach der Gruppenphase freigeschaltet.</div></section>
<button class="primary" onclick="resetTournament()">Neues Turnier erstellen</button></section></main>
<script>
let players=[],groups=[],matches=[],rounds=[],round=0,started=false,stage="group",tables=4,qualify=2,champion=null;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function addPlayer(){let n=$('playerName').value.trim();if(!n)return;if(players.some(p=>p.toLowerCase()===n.toLowerCase()))return alert('Name bereits vorhanden!');players.push(n);$('playerName').value='';showPlayers()}
function removePlayer(i){players.splice(i,1);showPlayers()}
function showPlayers(){$('count').textContent=players.length;$('players').innerHTML=players.map((p,i)=>`<div class="player">${esc(p)} <button onclick="removePlayer(${i})">✖</button></div>`).join('')}
$('playerName').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()});
function createTournament(){let n=+$('groupCount').value;tables=+$('tableCount').value;qualify=+$('qualify').value;if(players.length<2)return alert('Mindestens 2 Teilnehmer!');if(!Number.isInteger(n)||n<1||n>players.length||!Number.isInteger(tables)||tables<1||tables>30)return alert('Bitte Einstellungen prüfen!');groups=Array.from({length:n},()=>[]);shuffle(players).forEach((p,i)=>groups[i%n].push(p));matches=[];groups.forEach((g,gi)=>{let a=[...g];if(a.length%2)a.push(null);let len=a.length;for(let r=0;r<len-1;r++){for(let i=0;i<len/2;i++){let x=a[i],y=a[len-1-i];if(x&&y)matches.push({a:x,b:y,g:gi,done:false})}let first=a[0],rest=a.slice(1);rest.unshift(rest.pop());a=[first,...rest]}});rounds=makeRounds(matches);round=0;started=false;stage='group';champion=null;$('setup').classList.add('hidden');$('tournament').classList.remove('hidden');showGroups();showTables();showRound()}
function makeRounds(list){let pending=shuffle(list.filter(m=>!m.done)),out=[];while(pending.length){let batch=[],used=new Set();for(let i=0;i<pending.length;){let m=pending[i];if(!used.has(m.a)&&!used.has(m.b)&&batch.length<tables){used.add(m.a);used.add(m.b);m.table=batch.length+1;batch.push(m);pending.splice(i,1)}else i++}out.push(batch)}return out}
function showGroups(){$('groups').innerHTML=groups.map((g,i)=>`<div class="group"><h3>Gruppe ${String.fromCharCode(65+i)}</h3>${g.map(p=>`<div class="player">${esc(p)}</div>`).join('')}</div>`).join('')}
function stats(gi){let s=groups[gi].map(name=>({name,played:0,wins:0,losses:0,points:0,diff:0}));matches.filter(m=>m.done&&m.g===gi).forEach(m=>{let a=s.find(x=>x.name===m.a),b=s.find(x=>x.name===m.b);a.played++;b.played++;a.diff+=m.sa-m.sb;b.diff+=m.sb-m.sa;if(m.sa>m.sb){a.wins++;a.points+=2;b.losses++}else{b.wins++;b.points+=2;a.losses++}});return s.sort((a,b)=>b.points-a.points||b.diff-a.diff||b.wins-a.wins||a.name.localeCompare(b.name))}
function showTables(){$('tables').innerHTML=groups.map((g,i)=>`<div class="group"><h3>Gruppe ${String.fromCharCode(65+i)}</h3><table><tr><th>Platz</th><th>Name</th><th>Sp.</th><th>Sieg</th><th>Niederl.</th><th>Punkte</th><th>Diff.</th></tr>${stats(i).map((p,j)=>`<tr><td>${j+1}</td><td>${esc(p.name)}</td><td>${p.played}</td><td>${p.wins}</td><td>${p.losses}</td><td>${p.points}</td><td>${p.diff>0?'+':''}${p.diff}</td></tr>`).join('')}</table></div>`).join('')}
function showRound(){if(round>=rounds.length){if(stage==='group')finishGroups();else finishKO();return}let batch=rounds[round];$('roundInfo').innerHTML=`<span class="badge">${stage==='group'?'Gruppenphase':'K.-o.-Phase'} · Spielrunde ${round+1} von ${rounds.length}</span>`;$('matches').innerHTML=batch.map((m,i)=>`<div class="match"><b>🏓 Platte ${m.table}</b><p><b>${esc(m.a)}</b> gegen <b>${esc(m.b)}</b></p><input class="score" type="number" min="0" id="a${i}" ${!started||m.done?'disabled':''}> : <input class="score" type="number" min="0" id="b${i}" ${!started||m.done?'disabled':''}></div>`).join('');$('startButton').disabled=started;$('nextButton').disabled=!started}
function startRound(){started=true;showRound()}
function nextRound(){let batch=rounds[round],res=[];for(let i=0;i<batch.length;i++){let a=$('a'+i),b=$('b'+i);if(!a.value||!b.value||+a.value===+b.value||+a.value<0||+b.value<0)return alert('Bitte gültige Ergebnisse ohne Unentschieden eintragen!');res.push([+a.value,+b.value])}batch.forEach((m,i)=>{m.sa=res[i][0];m.sb=res[i][1];m.done=true;m.winner=m.sa>m.sb?m.a:m.b});round++;started=false;if(stage==='group')showTables();else showKO();showRound()}
function finishGroups(){let q=groups.flatMap((g,i)=>stats(i).slice(0,Math.min(qualify,g.length)).map(p=>p.name));if(q.length<2){$('knockout').textContent='Nicht genügend Teilnehmer.';return}let size=1;while(size<q.length)size*=2;let bye=size-q.length,sh=shuffle(q),ko=[];let pos=0;for(let i=0;i<size/2;i++){let a=sh[pos++];if(i<bye)ko.push({a,b:'FREILOS',done:true,winner:a});else ko.push({a,b:sh[pos++],done:false})}let playable=ko.filter(m=>!m.done);rounds=makeRounds(playable);if(ko.some(m=>m.done))rounds.unshift(ko.filter(m=>m.done));stage='ko';round=0;showKO();showRound()}
function showKO(){$('knockout').innerHTML=rounds.flat().map(m=>`<div class="group"><b>${esc(m.a)}</b> ${m.b==='FREILOS'?'🎟️ Freilos':'gegen <b>'+esc(m.b)+'</b>'} ${m.winner?'<p class="status">Weiter: '+esc(m.winner)+'</p>':''}</div>`).join('')}
function finishKO(){let winners=rounds.flat().filter(m=>m.winner).map(m=>m.winner);if(winners.length===1){champion=winners[0];$('knockout').innerHTML+='<h2 class="winner">🏆 TURNIERSIEGER: '+esc(champion)+'</h2>';return}let size=1;while(size<winners.length)size*=2;let bye=size-winners.length,sh=shuffle(winners),ko=[],pos=0;for(let i=0;i<size/2;i++){let a=sh[pos++];if(i<bye)ko.push({a,b:'FREILOS',done:true,winner:a});else ko.push({a,b:sh[pos++],done:false})}rounds=[...ko.filter(m=>m.done),...makeRounds(ko.filter(m=>!m.done))];round=0;showKO();showRound()}
function resetTournament(){if(!confirm('Neues Turnier erstellen?'))return;groups=[];matches=[];rounds=[];round=0;started=false;stage='group';$('tournament').classList.add('hidden');$('setup').classList.remove('hidden')}
showPlayers();
</script></body></html>
